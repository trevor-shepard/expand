name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - cursor/modern-shell-a104
  workflow_dispatch:

# peaceiris pushes the built `apps/web/dist` to `gh-pages` (no Pages "create site" API).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @expand/contracts
          npm run build -w @expand/game-engine

      - name: Build static site
        run: npm run build -w @expand/web
        env:
          VITE_BASE_PATH: /expand/
          VITE_STATIC_LEVELS: "true"

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
